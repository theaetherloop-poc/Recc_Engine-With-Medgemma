discover_ingredients_medgemma:
  description: >
    You have access to MedGemma, a specialized medical AI, via the medgemma_query tool.

    CRITICAL REQUIREMENT: You MUST use the medgemma_query tool for EVERY query.
    Do NOT generate supplement recommendations from your own knowledge.
    Each recommendation MUST come from an actual medgemma_query tool call.
    If you skip tool calls, the output will be invalid.

    PATIENT ISSUES PROVIDED: {patient_issues}

    This contains:
    - biomarkers: Flagged biomarkers with high/low status and values
    - conditions: Diagnosed medical conditions
    - symptoms: Pain/skin/digestive/other symptoms
    - hormonal: Hormonal concerns (if present)
    - lifestyle: Diet style, stress level (if present)
    - sleep_issues: Sleep problems (if present)
    - exposures: Environmental exposures (mold, chemical)

    MANDATORY TASK - EXECUTE ALL TOOL CALLS:
    1. Go through EVERY patient issue listed above
    2. For EACH issue, call the medgemma_query tool with a concise query
    3. Record the supplements returned by MedGemma for each query
    4. You may combine 2-3 related issues into one query, but cover ALL issues

    CRITICAL - PREVENT DUPLICATE QUERIES:
    - NEVER issue the same query more than 3 times(in case of failures)
    - Track which issues you have already queried
    - Once all unique issues are queried, immediately proceed to compile results

    EXAMPLE TOOL CALLS YOU MUST MAKE:
    - medgemma_query("low vitamin D and calcium")
    - medgemma_query("high cholesterol and cardiovascular risk")
    - Continue for ALL patient issues...
    - Try to pair related issues into one query, but cover ALL issues

    AFTER ALL TOOL CALLS - COMPILE RESULTS:
    - Deduplicate ingredients (merge reasons if same ingredient addresses multiple issues)
    - Sort by priority (ingredients addressing multiple issues first)
    - Return 10-15 ingredients total

    OUTPUT FORMAT (JSON only):
    {
      "discovered_ingredients": [
        {
          "ingredient_name": "Vitamin D3",
          "reasons": ["low vitamin D", "immune support"]
        }
      ]
    }

  expected_output: >
    JSON object with "discovered_ingredients" array containing 15-20 ingredients.
    Each ingredient has: ingredient_name, reasons (array).
    Format: {"discovered_ingredients": [...]}
  agent: medgemma_ingredient_discovery

