# Final task for supplement recommendations - MedGemma clinical reasoning + Gemini structuring
generate_supplement_recommendations:
  description: >
    You have access to MedGemma clinical AI via the medgemma_recommender tool.

    CRITICAL REQUIREMENT: You MUST call the medgemma_recommender tool.
    Do NOT generate clinical recommendations from your own knowledge.
    The clinical reasoning MUST come from an actual medgemma_recommender tool call.
    If you skip the tool call, the output will be invalid.

    PATIENT DATA AVAILABLE:
    - Patient Summary: Output from summarize_patient_profile task (concise natural language summary)
    - MedGemma ingredients: Output from discover_ingredients_medgemma task (evidence-based candidate ingredients)

    MANDATORY TASK - EXECUTE TOOL CALL:
    1. Call the medgemma_recommender tool with:
       - patient_summary: The full patient summary from summarize_patient_profile task
       - candidate_ingredients: The discovered ingredients JSON from discover_ingredients_medgemma task

    2. Wait for MedGemma's response with clinical analysis and prioritized recommendations

    3. Structure MedGemma's recommendations into the required JSON format

    IMPORTANT:
    - MedGemma handles all clinical reasoning and prioritization
    - Your role is to call the tool and structure the output into valid JSON
    - Preserve MedGemma's clinical reasoning in the "why" field
    - Ensure 8-12 recommendations are included
    - Maintain the clinical priority ranking from MedGemma

    CRITICAL: Output ONLY the JSON structure. No explanatory text or reasoning outside the JSON.

  expected_output: >
    ONLY the JSON response with proper Pydantic validation. No additional text.
    OUTPUT FORMAT:
    {
      "final_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Concise 1-2 line patient-specific explanation"
        }
      ]
    }
  agent: supplement_recommender

