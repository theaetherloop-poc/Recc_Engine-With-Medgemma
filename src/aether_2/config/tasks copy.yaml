# Focus area assignment task - maps supplements to health focus areas
assign_focus_areas:
  description: >
    You are a functional medicine specialist assigning health focus areas to supplements.

    YOUR TASK: For each supplement in the recommendations, assign 1-2 most relevant focus area codes.

    DATA AVAILABLE:
    - Supplement recommendations: Output from generate_supplement_recommendations task (ingredient_name, rank, why)
    - Focus areas: {focus_areas} (patient's health priorities with scores)

    FOCUS AREA CODES (assign 1-2 per supplement):
    - CM: Cardiometabolic & Metabolic Health (cholesterol, blood sugar, heart health)
    - COG: Cognitive & Mental Health (brain function, mood, memory)
    - DTX: Detoxification & Biotransformation (liver function, toxin clearance)
    - IMM: Immune Function & Inflammation (immune support, reducing inflammation)
    - MITO: Mitochondrial & Energy Metabolism (cellular energy, fatigue)
    - SKN: Skin & Barrier Function (skin health, wound healing)
    - STR: Stress-Axis & Nervous System Resilience (stress response, adrenals)
    - HRM: Hormonal Health (thyroid, sex hormones, hormone transport)
    - GA: Gut Health and Assimilation (digestion, nutrient absorption)

    FOR EACH SUPPLEMENT:
    1. Look at the "why" field to understand what health issue it addresses
    2. Match to 1-2 focus areas based on supplement's mechanism of action
    3. Prioritize focus areas that are highest scored for this patient

    CRITICAL: Output ONLY the JSON structure with focus areas added.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Patient-specific reasoning",
          "focus_area": ["CODE1", "CODE2"]
        }
      ]
    }
  agent: focus_area_specialist

# Final task for dosage compilation using MedGemma
compile_final_supplement_recommendations:
  description: >
    You are a clinical pharmacist adding dosage information using MedGemma.

    CRITICAL REQUIREMENT: You MUST call the medgemma_dosage tool for EVERY supplement.
    Do NOT generate dosages from your own knowledge.
    Each dosage and frequency MUST come from an actual medgemma_dosage tool call.

    DATA AVAILABLE:
    - Supplements with focus areas: Output from assign_focus_areas task (ingredient_name, rank, why, focus_area)
    - Patient demographics: {patient_demographics}

    MANDATORY TASK - EXECUTE ALL TOOL CALLS:
    For EACH supplement in the list, you MUST:
    1. Call the medgemma_dosage tool with:
       - supplement_name: The exact ingredient name
       - patient_context: Combine patient demographics with key health issue from "why" field
    2. Wait for MedGemma's response
    3. Use the returned dosage and frequency in your output

    EXAMPLE TOOL CALLS:
    - medgemma_dosage(supplement_name="Vitamin D3", patient_context="40-year-old male with low vitamin D level")
    - medgemma_dosage(supplement_name="Omega-3 Fish Oil", patient_context="50-year-old male with high cholesterol")

    COMPILE FINAL OUTPUT:
    For each supplement, output:
    1. ingredient_name: Keep exact name from previous task
    2. recommended_dosage: Use dosage from MedGemma response
    3. frequency: Use frequency/timing from MedGemma response
    4. focus_area: Keep the focus_area array from previous task (already assigned)
    5. why: Keep the original patient-specific reasoning

    CRITICAL: Output ONLY the JSON structure. No explanatory text.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "supplement_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "recommended_dosage": "Clinical dosage from MedGemma",
          "frequency": "Timing and frequency from MedGemma",
          "focus_area": ["CODE1", "CODE2"],
          "why": "Patient-specific reasoning"
        }
      ]
    }
  agent: final_supplement_compiler

