# Final task for supplement recommendations - Gemini clinical reasoning
generate_supplement_recommendations:
  description: >
    You are a clinical supplement specialist analyzing patient data to create recommendations.

    PATIENT DATA AVAILABLE:
    - Patient Summary: Output from summarize_patient_profile task (concise natural language summary)
    - Candidate ingredients: Output from discover_ingredients_medgemma task (evidence-based candidate ingredients)

    YOUR TASK:
    1. Review the patient summary to understand their health profile
    2. Analyze the candidate ingredients and their reasons
    3. Select the TOP 8-12 most important supplements for THIS patient
    4. Rank by clinical priority (most critical issues first)
    5. Provide patient-specific reasoning for each

    SELECTION RULES:
    - Do NOT select supplements that cover the exact same problems unless they complement each other
    - Maximize coverage across different health issues
    - Prioritize supplements addressing multiple patient issues
    - Consider the patient's specific biomarkers, symptoms, and conditions

    CRITICAL: Output ONLY the JSON structure. No explanatory text or reasoning outside the JSON.

  expected_output: >
    ONLY the JSON response with proper Pydantic validation. No additional text.
    OUTPUT FORMAT:
    {
      "final_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Concise 1-2 line patient-specific explanation"
        }
      ]
    }
  agent: supplement_recommender

# Focus area assignment task - maps supplements to health focus areas
assign_focus_areas:
  description: >
    You are a functional medicine specialist assigning health focus areas to supplements.

    YOUR TASK: For each supplement in the recommendations, assign 1-2 most relevant focus area codes.

    DATA AVAILABLE:
    - Supplement recommendations: Output from generate_supplement_recommendations task (ingredient_name, rank, why)
    - Focus areas: {focus_areas} (patient's health priorities with scores)

    FOCUS AREA CODES (assign 1-2 per supplement):
    - CM: Cardiometabolic & Metabolic Health (cholesterol, blood sugar, heart health)
    - COG: Cognitive & Mental Health (brain function, mood, memory)
    - DTX: Detoxification & Biotransformation (liver function, toxin clearance)
    - IMM: Immune Function & Inflammation (immune support, reducing inflammation)
    - MITO: Mitochondrial & Energy Metabolism (cellular energy, fatigue)
    - SKN: Skin & Barrier Function (skin health, wound healing)
    - STR: Stress-Axis & Nervous System Resilience (stress response, adrenals)
    - HRM: Hormonal Health (thyroid, sex hormones, hormone transport)
    - GA: Gut Health and Assimilation (digestion, nutrient absorption)

    FOR EACH SUPPLEMENT:
    1. Look at the "why" field to understand what health issue it addresses
    2. Match to 1-2 focus areas based on supplement's mechanism of action
    3. Prioritize focus areas that are highest scored for this patient

    CRITICAL: Output ONLY the JSON structure with focus areas added.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Patient-specific reasoning",
          "focus_area": ["CODE1", "CODE2"]
        }
      ]
    }
  agent: focus_area_specialist

# Final task for dosage compilation - Gemini clinical reasoning
compile_final_supplement_recommendations:
  description: >
    You are a clinical pharmacist adding evidence-based dosage information.

    DATA AVAILABLE:
    - Supplements with focus areas: Output from assign_focus_areas task (ingredient_name, rank, why, focus_area)
    - Patient demographics: {patient_demographics}

    YOUR TASK:
    For EACH supplement in the list, determine:
    1. recommended_dosage: Evidence-based dosage appropriate for this patient
    2. frequency: Optimal timing and frequency (e.g., "Once daily with food")

    DOSAGE GUIDELINES:
    - Consider patient demographics (age, sex, weight)
    - Account for the health condition being addressed (from "why" field)
    - Use standard clinical dosages from established guidelines
    - Adjust for bioavailability and absorption factors
    - Consider time of day for optimal efficacy (morning vs evening, with/without food)

    COMPILE FINAL OUTPUT:
    For each supplement, output:
    1. ingredient_name: Keep exact name from previous task
    2. recommended_dosage: Evidence-based dosage (e.g., "2000 IU", "500mg")
    3. frequency: Timing and frequency (e.g., "Once daily with breakfast")
    4. focus_area: Keep the focus_area array from previous task (already assigned)
    5. why: Keep the original patient-specific reasoning

    CRITICAL: Output ONLY the JSON structure. No explanatory text.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "supplement_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "recommended_dosage": "Evidence-based dosage",
          "frequency": "Timing and frequency",
          "focus_area": ["CODE1", "CODE2"],
          "why": "Patient-specific reasoning"
        }
      ]
    }
  agent: final_supplement_compiler

