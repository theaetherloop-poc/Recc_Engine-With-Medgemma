# Preprocessing tasks (evaluate_inputs, evaluate_focus_areas, compile_user_profile)
# have been migrated to regular Python functions in utils/preprocessing.py

# Profile summary task - clean prose summary, organized into a few topical paragraphs.
# Consumed by all downstream agents (recommender, focus area assigner, dosage compiler).
summarize_patient_profile:
  description: >
    Write a clear, complete prose summary of the patient's health profile.
    Use 4-6 short paragraphs grouped by theme. Keep it readable — no headers,
    no bullet lists, no JSON.

    USER PROFILE: {user_profile}

    SUGGESTED PARAGRAPH STRUCTURE (only include themes that have data):
    1. Demographics + flagged biomarkers (with values and units).
    2. Diagnosed conditions and current medications.
    3. Current symptoms in the patient's own words.
    4. Sleep, stress, diet, and lifestyle factors.
    5. Allergies, environmental exposures, hormonal health, family history.
    6. Current supplements the patient is already taking.

    RULES:
    - Cover EVERY data point present in the input — do not drop anything.
    - State each fact ONCE. Do not repeat the same biomarker or condition across paragraphs.
    - Include actual values and units for biomarkers (e.g. "Vitamin D 15 ng/mL — low").
    - Use the patient's own words for subjective symptoms when available.
    - No filler phrases, no clinical jargon padding, no "this patient presents with...".
    - If a theme has no data, skip its paragraph entirely.

  expected_output: >
    Clean prose summary in 4-6 short paragraphs. No headers, no bullets, no JSON.
    Every input data point covered exactly once.
  agent: profile_summarizer

# NOTE: rank_ingredients_rag is DISABLED
