# Preprocessing tasks (evaluate_inputs, evaluate_focus_areas, compile_user_profile)
# have been migrated to regular Python functions in utils/preprocessing.py

# Profile summary task - creates concise natural language summary
summarize_patient_profile:
  description: >
    Summarize the patient's health profile in natural language.

    USER PROFILE: {user_profile}

    MUST INCLUDE (if present in data):
    - Demographics (age, sex)
    - Flagged biomarkers with values and status (high/low)
    - Medical conditions and diagnoses
    - Allergies
    - Symptoms (pain, skin, headaches, digestive)
    - Sleep issues
    - Environmental exposures (mold, chemical)
    - Hormonal concerns with patient's own description if available
    - Diet style (vegetarian, vegan, etc.)
    - Stress level (especially if high ≥7)
    - Family history (brief mention if present)
    - Current supplements

    FORMAT RULES:
    - One paragraph, 100-150 words max
    - Use short phrases, no filler words
    - Include actual values/numbers where available
    - Mention patient's own words for concerns when available
    - Simplify the explaination adn don't use  confusing phrases from the input as it is.

  expected_output: >
    A single paragraph covering ALL patient details concisely.
    No JSON, no headers - just the summary text.
  agent: profile_summarizer

