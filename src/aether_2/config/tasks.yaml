# ACTIVE - Serper-based web ingredient discovery
discover_ingredients_web:
  description: >
    Use web search to discover evidence-based supplement names for this patient's key health issues.

    PATIENT ISSUES: {patient_issues}

    STEP 1 — Identify the 5-6 most clinically significant axes from the patient issues above.
    Group related issues into axes (e.g., "low Vitamin D + bone health" = one axis).
    Do NOT create an axis for every individual issue — consolidate.

    STEP 2 — Run exactly ONE search per axis (maximum 6 searches total) using this format:
    - "site:examine.com [condition] supplements"
    - "site:pubmed.ncbi.nlm.nih.gov [condition] supplementation"

    STEP 3 — From each search result, extract ONLY supplement/ingredient names and which
    patient condition they address. Ignore all other content (URLs, dates, snippets).

    RULES:
    - Maximum 6 searches. Stop after 6 regardless of remaining issues.
    - Extract 2-3 ingredient names per search at most.
    - Do NOT invent ingredients — only include names found in search results.
    - Output ONLY ingredient_name, reasons, and source fields.

    OUTPUT FORMAT:
    {
      "discovered_ingredients": [
        {"ingredient_name": "Vitamin D3", "reasons": ["low vitamin D"], "source": "web"},
        {"ingredient_name": "Omega-3 Fish Oil", "reasons": ["high cholesterol"], "source": "web"}
      ]
    }

  expected_output: >
    JSON with "discovered_ingredients" array. Each entry has exactly three fields:
    ingredient_name (string), reasons (list of patient conditions), source (string).
    10-15 ingredients total. No other fields.
  agent: web_ingredient_discovery




# Supplement recommendations - Gemini clinical reasoning
generate_supplement_recommendations:
  description: >
    You are a board-certified physician and clinical nutritionist.

    PATIENT DATA AVAILABLE:
    - Patient Summary: Output from summarize_patient_profile task
    - Discovered ingredients: Output from discover_ingredients_web task
      Each ingredient includes: ingredient_name, reasons (which conditions it addresses),
      summary (Examine.com evidence overview), dosage_hint, citation_count (evidence strength),
      categories, research_summaries. Use citation_count as a proxy for evidence strength
      when prioritising — higher citations = stronger evidence base.

    YOUR TASK:
    1. Analyze the patient summary to understand their health profile
    2. Review the discovered ingredients and their reasons
    3. For each distinct activated health axis in this patient's profile, select at most
       1 supplement — the highest-leverage one. Only add a second for the same axis if
       there is a strong, independent clinical reason (different mechanism, different signal).
    4. Before finalizing, prune the list:
       - Remove anything a quality multivitamin routinely covers (e.g. B5, standard zinc,
         vitamin C at non-therapeutic levels, vitamin E) unless there is a specific documented
         deficiency or clear clinical indication beyond general replenishment.
       - Remove anything redundant because a chosen supplement already covers that axis
         (e.g. if berberine is selected for metabolic health, remove chromium and niacin).
       - Remove anything justified only by a borderline biomarker with no symptom corroboration.
    5. Consider the patient's existing supplements and provide a wholistic protocol including the existing ones amd reasoning for the same and remove them from the final list if they are not needed.
    6. Provide patient-specific reasoning for each recommendation.

    OUTPUT COUNT RULE: Recommend exactly as many supplements as this patient's active signals
    genuinely justify — no more, no less. Do not pad the list to reach any particular number,
    and do not cut the list short if signals remain unaddressed.

    CLINICAL ANALYSIS GUIDELINES:
    - Address flagged biomarkers (high/low status) and their clinical significance
    - Consider medical conditions, symptoms, pain, and skin health issues
    - Account for diet restrictions when relevant
    - Consider high stress as a factor when relevant
    - Note safety considerations and potential interactions

    "WHY" GUIDELINES:
    - Reference specific patient data (biomarkers, conditions, symptoms)
    - Be specific to THIS patient - avoid generic statements
    - 2-3 lines max per recommendation

    CRITICAL: Output ONLY the JSON structure. No explanatory text outside the JSON.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "final_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Concise 1-2 line patient-specific explanation"
        }
      ]
    }
  agent: supplement_recommender

# Focus area assignment task - maps supplements to health focus areas
assign_focus_areas:
  description: >
    You are a functional medicine specialist assigning health focus areas to supplements.

    YOUR TASK: For each supplement in the recommendations, assign 1-2 most relevant focus area codes.

    DATA AVAILABLE:
    - Patient profile report: Output from summarize_patient_profile task (full clinical context)
    - Supplement recommendations: Output from generate_supplement_recommendations task (ingredient_name, rank, why)
    - Focus areas scoring: {focus_areas} (patient's health priorities with scores)

    Use the patient profile to anchor your focus area assignments to THIS patient's
    actual presentation — not generic supplement-area mappings. If the patient has
    documented sleep issues, lean STR/COG for relevant supplements; if metabolic
    biomarkers are flagged, lean CM; and so on.

    FOCUS AREA CODES (assign 1-2 per supplement):
    - CM: Cardiometabolic & Metabolic Health (cholesterol, blood sugar, heart health)
    - COG: Cognitive & Mental Health (brain function, mood, memory)
    - DTX: Detoxification & Biotransformation (liver function, toxin clearance)
    - IMM: Immune Function & Inflammation (immune support, reducing inflammation)
    - MITO: Mitochondrial & Energy Metabolism (cellular energy, fatigue)
    - SKN: Skin & Barrier Function (skin health, wound healing)
    - STR: Stress-Axis & Nervous System Resilience (stress response, adrenals)
    - HRM: Hormonal Health (thyroid, sex hormones, hormone transport)
    - GA: Gut Health and Assimilation (digestion, nutrient absorption)

    FOR EACH SUPPLEMENT:
    1. Look at the "why" field to understand what health issue it addresses
    2. Match to 1-2 focus areas based on supplement's mechanism of action
    3. Prioritize focus areas that are highest scored for this patient

    CRITICAL: Output ONLY the JSON structure with focus areas added.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "rank": 1,
          "why": "Patient-specific reasoning",
          "focus_area": ["CODE1", "CODE2"]
        }
      ]
    }
  agent: focus_area_specialist

# Final task for dosage compilation using LLM clinical knowledge
compile_final_supplement_recommendations:
  description: >
    You are a clinical pharmacist compiling evidence-based dosages for each supplement.

    DATA AVAILABLE:
    - Patient profile report: Output from summarize_patient_profile task (full clinical context — biomarkers, conditions, medications, allergies, etc.)
    - Supplements with focus areas: Output from assign_focus_areas task (ingredient_name, rank, why, focus_area)
    - Patient demographics: {patient_demographics}

    YOUR TASK:
    For each supplement, apply your clinical knowledge to assign appropriate dosage and timing.
    Use the FULL patient profile to personalise dosing, form, and timing — including:
    - Adjusting dose for age, weight, biological sex
    - Selecting forms compatible with documented allergies or sensitivities
    - Flagging interactions with current medications listed in the profile
    - Reducing dose when the patient is already on a related supplement
    - Adjusting timing around documented sleep, digestive, or stress patterns

    FORM SPECIFICITY RULES — apply these as hard overrides:
    - Magnesium: MUST specify the salt form based on the patient's reason for taking it.
      sleep/relaxation → glycinate (~200 mg nightly); constipation → citrate or oxide;
      cognitive/neurological → threonate; cramping → malate. Never output just "Magnesium".
    - Vitamin D3: MUST note K2 pairing (e.g. "Take with Vitamin K2 MK-7 to direct calcium
      to bones"). If patient has high serum calcium, add a caution note instead.
    - Vitamin B12: MUST specify methylcobalamin form, not cyanocobalamin.
    - Vitamin B6: MUST specify P-5-P (pyridoxal-5-phosphate) form.
    - Curcumin/Turmeric: MUST note "standardized extract (≥95% curcuminoids) or
      phytosome/liposomal form required for therapeutic effect".
    - Red Rice Yeast: MUST note "take at night" in frequency.
    - Probiotics: MUST specify strain(s) and CFU count. MUST note
      "take on empty stomach, 20-30 minutes before breakfast". Only include if GI symptoms
      are documented in the patient's "why" field.

    For each supplement output:
    1. ingredient_name: Keep from previous task, apply form specificity rules above
    2. recommended_dosage: Evidence-based clinical dosage
    3. frequency: Timing and frequency based on clinical best practice
    4. focus_area: Keep the focus_area array from the previous task unchanged
    5. why: Keep the original patient-specific reasoning unchanged

    CRITICAL: Output ONLY the JSON structure. No explanatory text.

  expected_output: >
    ONLY the JSON response. No additional text.
    OUTPUT FORMAT:
    {
      "supplement_recommendations": [
        {
          "ingredient_name": "Exact ingredient name",
          "recommended_dosage": "Evidence-based clinical dosage",
          "frequency": "Timing and frequency",
          "focus_area": ["CODE1", "CODE2"],
          "why": "Patient-specific reasoning"
        }
      ]
    }
  agent: final_supplement_compiler


