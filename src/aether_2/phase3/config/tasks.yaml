# Focus Areas Prioritization Task
prioritize_focus_areas:
  description: >
    You are analyzing a patient's health focus areas to create a prioritized list with clear explanations.

    INPUTS PROVIDED:
    - focus_areas_scores: {focus_areas_scores} (JSON with 9 focus area codes and their scores)
    - focus_areas_reasons: {focus_areas_reasons} (JSON with reasons/contributors for each focus area)

    FOCUS AREA CODES AND NAMES:
    - CM: Cardiometabolic & Metabolic Health
    - STR: Stress-Axis & Nervous System Resilience
    - HRM: Hormonal Health (Transport)
    - IMM: Immune Function & Inflammation
    - SKN: Skin & Barrier Function
    - COG: Cognitive & Mental Health
    - MITO: Mitochondrial & Energy Metabolism
    - DTX: Detoxification & Biotransformation
    - GA: Gut Health and Assimilation

    TASK:
    1. Parse the focus_areas_scores JSON to get all 9 scores
    2. Rank all 9 focus areas by score (highest score = priority 1, lowest = priority 9)
    3. For each focus area, parse the reasons from focus_areas_reasons
    4. Create a human-readable "why" explanation that:
       - Synthesizes ALL reasons for that focus area into a clear summary, do not miss any reason
       - Addresses the user directly (use "You reported...", "Your...", etc.)
       - Avoids technical jargon - use plain language
       - Is concise (4-5 sentences maximum)
       - Connects the reasons to real health impacts
       - Based on the score the text should also reflect on why this focus area needs most attention(for example if the score is high it means that the patient has multiple reasons that are contributing to this focus area and it needs more attention)

    
    OUTPUT ALL 9 FOCUS AREAS ranked by priority with their codes, names, why explanations, and priority numbers.

    CRITICAL: Output ONLY the JSON structure. No explanatory text outside the JSON.

  expected_output: >
    ONLY the JSON response with proper Pydantic validation. No additional text.
    OUTPUT FORMAT:
    Make sure you don't add include a json identifier like this ```json and just return the json object
    {
      "prioritized_focus_areas": [
        {
          "cfa_code": "STR",
          "cfa_name": "Stress-Axis & Nervous System Resilience",
          "why": "You reported high work stress, elevated stress levels, and poor sleep quality.",
          "priority": 1
        },
        ... (all 9 focus areas)
      ]
    }
  agent: focus_areas_prioritizer



# Phase 3 Supplement Refinement Tasks (Sequential Chain)
refine_supplements_chunk1:
  description: >
    Refine Phase 2 supplements based on patient goals and triggers (q001-q014).

    INPUTS:
    - phase2_recommendations: {phase2_recommendations} (BASELINE - RESPECT THIS)
    - patient_issues: {patient_issues} (Phase 2 identified these issues - supplements address THESE)
    - chunk1_qna: {chunk1_qna}

    🚫 CRITICAL RULES:
    1. NEVER modify focus_area arrays - they are LOCKED from Phase 2
    2. KEEP supplements mostly unchanged (respect the baseline - most supplements should remain as-is)
    3. Phase 2 chose supplements to address patient_issues - RESPECT this clinical logic
    4. Only modify with CLEAR chunk1 justification

    WHEN TO MODIFY (rare):
    - TIMING: Move to bedtime if top goal is "better sleep"
    - REMOVE: if patient reports intolerance/trigger in chunk1
    - ADD: if top goal completely unaddressed by existing supplements
    The above are just examples, the agent should use its clinical reasoning to decide when to modify the protocol.

    WHY FIELD:
    - PRESERVE Phase 2 text: "[Phase 2 why]. [Chunk1 addition if relevant]."
    - Example: "Supports cortisol regulation. Your top goal is improving sleep quality."
    - Do not explicitly state the question number(e.g Q070) or sources(rag,web) as the user won't understand these.

    OUTPUT: JSON only, same structure as phase2_recommendations.

  expected_output: >
    Refined protocol with minimal changes, locked focus_area arrays, cumulative why fields.
  agent: supplement_refiner_chunk1

refine_supplements_chunk2:
  description: >
    Refine chunk1 output based on medications, activity, sunlight, sleep (q015-q028).

    INPUTS:
    - Previous protocol from chunk1 (via context)
    - patient_issues: {patient_issues} (Phase 2 baseline issues)
    - chunk2_qna: {chunk2_qna}

    🚫 CRITICAL RULES:
    1. NEVER modify focus_area arrays - LOCKED from Phase 2
    2. KEEP supplements mostly unchanged
    3. Only modify with CLEAR chunk2 justification

    WHEN TO MODIFY (rare):
    - DRUG DEPLETION: PPI → increase B12/Mg if already present, add only if absent
    - SUNLIGHT: High exposure → reduce Vit D dosage (don't remove)
    - TIMING: Move Mg/glycine to bedtime for sleep
    - REMOVE: Only if patient already takes same supplement
    The above are just examples, the agent should use its clinical reasoning to decide when to modify the protocol.
    WHY FIELD:
    - PRESERVE all previous text: "[Chunk1 why]. [Chunk2 addition if relevant]."
    - Do not explicitly state the question number(e.g Q070) or sources(rag,web) as the user won't understand these.

    OUTPUT: JSON only.

  expected_output: >
    Refined protocol, locked focus_area, cumulative why.
  agent: supplement_refiner_chunk2

