# Agent 8: Final Protocol Optimizer (Deduplication & Shortlisting)
optimize_final_protocol:
  description: >
    Optimize chunk6 output: remove duplicates, eliminate redundancies, shortlist to ≤10 supplements.

    INPUTS:
    - Previous protocol from chunk6 (via context)
    - patient_issues: {patient_issues}
    - chunk1_qna: {chunk1_qna} (for top goals)

    🚫 CRITICAL RULES:
    1. NEVER modify focus_area arrays - LOCKED
    2. NEVER modify "why" fields - PRESERVE complete reasoning chain
    3. MUST output ≤10 supplements (count and remove lowest priority if >10)

    DEDUPLICATION:
    - Same ingredient, different forms → Keep most appropriate (Mg citrate for constipation, glycinate for sleep)
    - Multiple anti-inflammatories → Keep 1-2 most evidence-based
    - Multiple adaptogens → Keep 1 most relevant to goals

    PRIORITIZATION (if >10):
    1. Top 3 health goals (chunk1)
    2. Drug-nutrient depletions
    3. Chronic conditions (migraines, pain)
    4. Foundational (Vit D, omega-3)
    5. Nice-to-have (remove these first)

    OUTPUT: JSON only, ≤10 supplements.

  expected_output: >
    Final protocol ≤10 supplements, no duplicates, preserved why/focus_area.
  agent: final_protocol_optimizer


